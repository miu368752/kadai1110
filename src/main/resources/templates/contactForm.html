<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせフォーム</title>
</head>
<body>
  <h1>お問い合わせフォーム</h1>

  <form th:action="@{/contact/submit}" th:object="${contactForm}" method="post">
    <p>
      お名前：<input type="text" th:field="*{name}" />
      <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </p>
    <p>
      メールアドレス：<input type="email" th:field="*{email}" />
      <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    </p>
    <p>
      電話番号（任意）：<input type="text" th:field="*{phone}" />
      <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
    </p>
    <p>
      件名：<input type="text" th:field="*{subject}" />
      <span th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></span>
    </p>
    <p>
      お問い合わせ内容：<br>
      <textarea th:field="*{message}" rows="6" cols="50"></textarea>
      <span th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></span>
    </p>

    <p><button type="submit">送信</button></p>
  </form>

  <hr>
  <p><a th:href="@{/contact/list}">お問い合わせ一覧へ</a></p>
</body>
</html>
